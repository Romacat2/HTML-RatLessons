<!DOCTYPE html>
<html lang="uk">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Урок - Roma's Rat Games</title>
		<link rel="stylesheet" href="../style.css">
		<link rel="manifest" href="../manifest.json">
		<link rel="icon" href="favicon.png">
		<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
		<meta name="theme-color" content="#121212">
		<script src="../nav.js"></script>
		<script src="../register-sw.js" defer></script>
		<style>
			:root {
				--nav-h: 4.5rem;
			}
			
			html, body {
				height: 100%;
				overflow: hidden;
			}
			
			.main-content {
				height: calc(100vh - var(--nav-h));
				height: calc(100svh - var(--nav-h));
				padding: 0 1rem;
				display: flex;
			}
			
			.hero {
				margin-top: 0;
				width: 100%;
				height: 100%;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: space-evenly;
				padding: 0.5rem 0;
				gap: 0;
			}
			
			.hearts {
				font-size: clamp(1.2rem, 4vh, 2.2rem);
				letter-spacing: 0.3rem;
				flex: 0 0 auto;
			}
			
			.heart-lost {
				opacity: 0.25;
				filter: grayscale(1);
			}
			
			.level-tag {
				font-size: clamp(0.75rem, 2vh, 0.85rem);
				opacity: 0.6;
				flex: 0 0 auto;
				text-align: center;
			}
			
			.question-wrap {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 0.8em;
				flex: 1 1 40%;
				min-height: 0;
				width: 100%;
				overflow: hidden;
				padding: 0 0.5rem;
			}
			
			.sentence-line {
				font-size: clamp(1.2rem, 6vh, 2.4rem);
				text-align: center;
				line-height: 1.6;
				overflow-wrap: anywhere;
				display: flex;
				flex-wrap: wrap;
				justify-content: center;
				align-items: baseline;
				gap: 0.05em;
				max-width: 100%;
				overflow-y: auto;
				max-height: 100%;
			}
			
			.sentence-char {
				white-space: pre;
			}
			
			.blank-input {
				width: 1.3em;
				font-size: inherit;
				font-family: inherit;
				text-align: center;
				border: none;
				border-bottom: 3px solid color-mix(in srgb, var(--text) 40%, transparent);
				background: transparent;
				color: var(--text);
				outline: none;
				padding: 0 0.05em;
			}
			
			.blank-input:focus {
				border-color: #4caf50;
			}
			
			.blank-input.correct {
				border-color: #4caf50;
				background: color-mix(in srgb, #4caf50 25%, transparent);
			}
			
			.blank-input.wrong {
				border-color: #ff5252;
				background: color-mix(in srgb, #ff5252 25%, transparent);
			}
			
			.feedback {
				font-size: clamp(1.1rem, 3.5vh, 1.8rem);
				height: 1.3em;
				display: flex;
				align-items: center;
				gap: 0.6rem;
				opacity: 0;
				transition: opacity 0.1s ease;
				flex: 0 0 auto;
			}
			
			.feedback.show {
				opacity: 1;
			}
			
			.submit-btn {
				font-size: clamp(0.95rem, 2.8vh, 1.15rem);
				padding: 0.7rem 2rem;
				border-radius: 14px;
				border: 2px solid color-mix(in srgb, #4caf50 60%, transparent);
				background: color-mix(in srgb, #4caf50 15%, transparent);
				color: var(--text);
				cursor: pointer;
				font-family: inherit;
				font-weight: 600;
				transition: background 0.15s ease, transform 0.1s ease;
				flex: 0 0 auto;
			}
			
			.submit-btn:hover,
			.submit-btn:focus-visible {
				background: color-mix(in srgb, #4caf50 25%, transparent);
			}
			
			.submit-btn:active {
				transform: scale(0.97);
			}
			
			.rat-rain {
				position: fixed;
				inset: 0;
				pointer-events: none;
				overflow: hidden;
				z-index: 999;
			}
			
			.rat-drop {
				position: absolute;
				top: -10vh;
				font-size: var(--rat-size, 1.8rem);
				animation: rat-fall var(--rat-duration, 1.4s) linear forwards;
				animation-delay: var(--rat-delay, 0s);
			}
			
			@keyframes rat-fall {
				from {
					transform: translateY(0) rotate(0deg);
					opacity: 1;
				}
				to {
					transform: translateY(120vh) rotate(25deg);
					opacity: 0.9;
				}
			}
			
			@media (prefers-reduced-motion: reduce) {
				.rat-drop {
					animation: none;
					display: none;
				}
			}
		</style>
	</head>
	<body>
		<nav>
			<div></div>
			<app-nav></app-nav>
		</nav>
		<div class="rat-rain" id="ratRain"></div>
		<div class="main-content">
			<div class="hero">
				<p class="level-tag" id="lessonTag"></p>
				<div class="hearts" id="hearts">❤️❤️❤️</div>

				<div class="question-wrap" id="questionWrap">
					<div class="sentence-line" id="sentenceLine"></div>
					<div class="feedback" id="feedback"></div>
				</div>

				<button type="button" class="submit-btn" id="submitBtn">Перевірити</button>
			</div>
		</div>

		<script src="lessons.js"></script>
		<script src="test.js"></script>
	</body>
</html>
