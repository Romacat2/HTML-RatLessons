<!DOCTYPE html>
<html lang="uk">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Урок - Roma's Rat Games</title>
		<link rel="stylesheet" href="../style.css">
		<link rel="manifest" href="../manifest.json">
		<link rel="icon" href="favicon.png">
		<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
		<meta name="theme-color" content="#121212">
		<script src="../nav.js"></script>
		<script src="../register-sw.js" defer></script>
		<style>
			:root {
				--nav-h: 4.5rem;
			}
			
			html, body {
				height: 100%;
				overflow: hidden;
			}
			
			.main-content {
				height: calc(100vh - var(--nav-h));
				height: calc(100svh - var(--nav-h));
				padding: 0 1rem;
				display: flex;
			}
			
			.hero {
				margin-top: 0;
				width: 100%;
				height: 100%;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: space-evenly;
				padding: 0.5rem 0;
				gap: 0;
			}
			
			.hearts {
				font-size: clamp(1.2rem, 4vh, 2.2rem);
				letter-spacing: 0.3rem;
				flex: 0 0 auto;
			}
			
			.heart-lost {
				opacity: 0.25;
				filter: grayscale(1);
			}
			
			.level-tag {
				font-size: clamp(0.75rem, 2vh, 0.85rem);
				opacity: 0.6;
				flex: 0 0 auto;
				text-align: center;
			}
			
			.question-wrap {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 0.6em;
				flex: 1 1 40%;
				min-height: 0;
				width: 100%;
				overflow: hidden;
			}
			
			.question-text {
				font-size: clamp(1.1rem, 7vh, 3rem);
				text-align: center;
				padding: 0 0.5rem;
				overflow-wrap: anywhere;
				flex: 0 1 auto;
				min-height: 0;
				overflow: hidden;
				display: -webkit-box;
				-webkit-box-orient: vertical;
				-webkit-line-clamp: 3;
			}
			
			.question-img {
				flex: 1 1 0;
				min-height: 0;
				max-width: min(90vw, 420px);
				max-height: 100%;
				width: auto;
				height: auto;
				object-fit: contain;
				border-radius: 16px;
			}
			
			.feedback {
				font-size: clamp(1.1rem, 3.5vh, 1.8rem);
				height: 1.3em;
				display: flex;
				align-items: center;
				gap: 0.6rem;
				opacity: 0;
				transition: opacity 0.1s ease;
			}
			
			.feedback.show {
				opacity: 1;
			}
			
			.options-wrap {
				display: flex;
				flex-direction: column;
				gap: 0.6rem;
				width: 100%;
				max-width: 480px;
				flex: 0 0 auto;
				min-height: 0;
			}
			
			.option-btn {
				font-size: clamp(0.85rem, 2.6vh, 1.1rem);
				padding: 0.5rem 0.8rem;
				border-radius: 14px;
				border: 2px solid color-mix(in srgb, var(--text) 18%, transparent);
				background: color-mix(in srgb, var(--text) 8%, transparent);
				color: var(--text);
				cursor: pointer;
				font-family: inherit;
				transition: background 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
				user-select: none;
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 2.6em;
				max-height: 13vh;
				overflow: hidden;
				text-align: center;
			}
			
			.option-btn .question-text {
				-webkit-line-clamp: 2;
				font-size: inherit;
			}
			
			.option-btn img {
				max-height: 100%;
				max-width: 100%;
				object-fit: contain;
				border-radius: 8px;
			}
			
			.option-btn:hover,
			.option-btn:focus-visible {
				background: color-mix(in srgb, var(--text) 16%, transparent);
			}
			
			.option-btn:active {
				transform: scale(0.97);
			}
			
			.option-btn.correct {
				border-color: #4caf50;
				background: color-mix(in srgb, #4caf50 30%, transparent);
			}
			
			.option-btn.wrong {
				border-color: #ff5252;
				background: color-mix(in srgb, #ff5252 25%, transparent);
			}
			
			.option-btn.disabled {
				pointer-events: none;
			}
			
			.rat-rain {
				position: fixed;
				inset: 0;
				pointer-events: none;
				overflow: hidden;
				z-index: 999;
			}
			
			.rat-drop {
				position: absolute;
				top: -10vh;
				font-size: var(--rat-size, 1.8rem);
				animation: rat-fall var(--rat-duration, 1.4s) linear forwards;
				animation-delay: var(--rat-delay, 0s);
			}
			
			@keyframes rat-fall {
				from {
					transform: translateY(0) rotate(0deg);
					opacity: 1;
				}
				to {
					transform: translateY(120vh) rotate(25deg);
					opacity: 0.9;
				}
			}
			
			@media (prefers-reduced-motion: reduce) {
				.rat-drop {
					animation: none;
					display: none;
				}
			}
		</style>
	</head>
	<body>
		<nav>
			<div></div>
			<app-nav></app-nav>
		</nav>
		<div class="rat-rain" id="ratRain"></div>
		<div class="main-content">
			<div class="hero">
				<p class="level-tag" id="lessonTag"></p>
				<div class="hearts" id="hearts">❤️❤️❤️</div>

				<div class="question-wrap" id="questionWrap">
					<!-- текст або картинка питання рендериться скриптом -->
					<div class="feedback" id="feedback"></div>
				</div>

				<div class="options-wrap" id="optionsWrap"></div>
			</div>
		</div>

		<script src="lessons.js"></script>
		<script src="test.js"></script>
	</body>
</html>
