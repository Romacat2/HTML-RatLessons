<!DOCTYPE html>
<html lang="uk">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Редактор уроку - Roma's Rat Games</title>
		<link rel="stylesheet" href="style.css">
		<link rel="manifest" href="manifest.json">
		<link rel="icon" href="favicon.png">
		<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
		<meta name="theme-color" content="#121212">
		<script src="nav.js"></script>
		<script src="register-sw.js" defer></script>
		<style>
			.hero {
				margin-top: -1rem;
				align-items: stretch;
				max-width: 640px;
				margin-left: auto;
				margin-right: auto;
			}

			.page-title {
				font-size: clamp(1.8rem, 5vw, 2.4rem);
				margin: 0;
				text-align: center;
			}

			.field-label {
				font-size: 0.85rem;
				opacity: 0.7;
				margin-bottom: 0.3rem;
				display: block;
			}

			.title-input {
				width: 100%;
				font-size: 1.2rem;
				padding: 0.7rem 0.9rem;
				border-radius: 10px;
				border: 2px solid color-mix(in srgb, var(--text) 20%, transparent);
				background: color-mix(in srgb, var(--text) 6%, transparent);
				color: var(--text);
				font-family: inherit;
				outline: none;
			}

			.title-input:focus {
				border-color: #4caf50;
			}

			.exercise-list {
				display: flex;
				flex-direction: column;
				gap: 1rem;
			}

			.exercise-card {
				border-radius: 16px;
				border: 2px solid color-mix(in srgb, var(--text) 18%, transparent);
				background: color-mix(in srgb, var(--text) 5%, transparent);
				padding: 1rem;
				display: flex;
				flex-direction: column;
				gap: 0.8rem;
			}

			.exercise-header {
				display: flex;
				justify-content: space-between;
				align-items: center;
			}

			.exercise-number {
				font-weight: 600;
				opacity: 0.8;
			}

			.exercise-remove {
				background: none;
				border: none;
				color: var(--text);
				opacity: 0.6;
				cursor: pointer;
				font-size: 1.2rem;
				padding: 0.2rem 0.5rem;
				border-radius: 8px;
			}

			.exercise-remove:hover,
			.exercise-remove:focus-visible {
				opacity: 1;
				background: color-mix(in srgb, #ff5252 25%, transparent);
			}

			.text-input {
				width: 100%;
				padding: 0.55rem 0.7rem;
				border-radius: 8px;
				border: 1.5px solid color-mix(in srgb, var(--text) 20%, transparent);
				background: color-mix(in srgb, var(--text) 4%, transparent);
				color: var(--text);
				font-family: inherit;
				font-size: 0.95rem;
				outline: none;
			}

			.text-input:focus {
				border-color: #4caf50;
			}

			.preview-chip {
				font-size: 0.75rem;
				opacity: 0.6;
				margin-top: 0.2rem;
			}

			.preview-img {
				max-width: 100%;
				max-height: 90px;
				border-radius: 8px;
				margin-top: 0.3rem;
				display: block;
			}

			.options-grid {
				display: flex;
				flex-direction: column;
				gap: 0.6rem;
			}

			.option-row {
				display: flex;
				align-items: center;
				gap: 0.6rem;
			}

			.option-row .text-input {
				flex: 1;
			}

			.correct-radio {
				display: flex;
				align-items: center;
				gap: 0.3rem;
				font-size: 0.8rem;
				opacity: 0.8;
				white-space: nowrap;
				cursor: pointer;
			}

			.correct-radio input {
				accent-color: #4caf50;
				width: 16px;
				height: 16px;
			}

			.add-exercise-btn {
				padding: 0.9rem;
				border-radius: 14px;
				border: 2px dashed color-mix(in srgb, #4caf50 60%, transparent);
				background: color-mix(in srgb, #4caf50 8%, transparent);
				color: var(--text);
				cursor: pointer;
				font-family: inherit;
				font-size: 1rem;
				font-weight: 600;
			}

			.add-exercise-btn:hover,
			.add-exercise-btn:focus-visible {
				background: color-mix(in srgb, #4caf50 16%, transparent);
			}

			.editor-actions {
				display: flex;
				gap: 1rem;
				justify-content: center;
				flex-wrap: wrap;
				margin-top: 0.5rem;
			}

			.save-error {
				text-align: center;
				color: #ff5252;
				font-size: 0.9rem;
				min-height: 1.3em;
			}
		</style>
	</head>
	<body>
		<nav>
			<div></div>
			<app-nav></app-nav>
		</nav>
		<div class="main-content">
			<div class="hero">
				<h1 class="page-title" id="pageTitle">Новий урок</h1>

				<div>
					<label class="field-label" for="lessonTitle">Назва уроку</label>
					<input type="text" id="lessonTitle" class="title-input" placeholder="Наприклад: Тварини">
				</div>

				<div class="exercise-list" id="exerciseList"></div>

				<button class="add-exercise-btn" id="addExerciseBtn" type="button">+ Додати вправу</button>

				<p class="save-error" id="saveError"></p>

				<div class="editor-actions">
					<a href="#" class="csharp-btn" style="background:#4caf50" id="saveBtn">💾 Зберегти урок</a>
					<a href="index.html" class="csharp-btn" style="background:#888">← Скасувати</a>
				</div>
			</div>
		</div>

		<script src="lessons.js"></script>
		<script>
			const params = new URLSearchParams(location.search);
			const lessonId = params.get("lesson");

			let lesson = lessonId ? LessonsStore.getById(lessonId) : null;
			if (!lesson) {
				lesson = LessonsStore.createEmpty();
			} else {
				// Глибока копія, щоб не мутувати збережені дані до натискання "Зберегти"
				lesson = JSON.parse(JSON.stringify(lesson));
			}
			if (lesson.exercises.length === 0) {
				lesson.exercises.push(LessonsStore.createEmptyExercise());
			}

			const pageTitleEl = document.getElementById("pageTitle");
			const lessonTitleEl = document.getElementById("lessonTitle");
			const exerciseListEl = document.getElementById("exerciseList");
			const addExerciseBtn = document.getElementById("addExerciseBtn");
			const saveBtn = document.getElementById("saveBtn");
			const saveErrorEl = document.getElementById("saveError");

			pageTitleEl.textContent = lessonId ? "Редагувати урок" : "Новий урок";
			lessonTitleEl.value = lesson.title;

			function renderExercises() {
				exerciseListEl.innerHTML = "";
				lesson.exercises.forEach((ex, i) => {
					const card = document.createElement("div");
					card.className = "exercise-card";
					card.innerHTML = `
						<div class="exercise-header">
							<span class="exercise-number">Вправа ${i + 1}</span>
							<button type="button" class="exercise-remove" data-remove-exercise="${i}" aria-label="Видалити вправу">✕</button>
						</div>
						<div>
							<label class="field-label">Питання (текст або URL картинки)</label>
							<input type="text" class="text-input" data-question="${i}" placeholder="cat або https://..." value="${escapeAttr(ex.question)}">
							<div class="preview-chip" data-question-preview="${i}"></div>
						</div>
						<div class="options-grid">
							${ex.options.map((opt, j) => `
								<div class="option-row">
									<input type="text" class="text-input" data-option="${i}:${j}" placeholder="Варіант ${j + 1}" value="${escapeAttr(opt.value)}">
									<label class="correct-radio">
										<input type="radio" name="correct-${i}" data-correct="${i}:${j}" ${opt.correct ? "checked" : ""}>
										вірно
									</label>
								</div>
							`).join("")}
						</div>
					`;
					exerciseListEl.appendChild(card);
				});
				updateAllPreviews();
			}

			function escapeAttr(str) {
				const div = document.createElement("div");
				div.textContent = str || "";
				return div.innerHTML.replace(/"/g, "&quot;");
			}

			function updateAllPreviews() {
				lesson.exercises.forEach((ex, i) => {
					const chip = exerciseListEl.querySelector(`[data-question-preview="${i}"]`);
					if (!chip) return;
					if (ex.question && LessonsStore.isImage(ex.question)) {
						chip.innerHTML = `🖼️ картинка <img class="preview-img" src="${escapeAttr(ex.question)}" alt="" onerror="this.style.display='none'">`;
					} else if (ex.question) {
						chip.textContent = "📝 текст";
					} else {
						chip.textContent = "";
					}
				});
			}

			exerciseListEl.addEventListener("input", (e) => {
				const target = e.target;
				if (target.dataset.question !== undefined) {
					const i = parseInt(target.dataset.question, 10);
					lesson.exercises[i].question = target.value;
					updateAllPreviews();
				} else if (target.dataset.option !== undefined) {
					const [i, j] = target.dataset.option.split(":").map(Number);
					lesson.exercises[i].options[j].value = target.value;
				}
			});

			exerciseListEl.addEventListener("change", (e) => {
				const target = e.target;
				if (target.dataset.correct !== undefined) {
					const [i, j] = target.dataset.correct.split(":").map(Number);
					lesson.exercises[i].options.forEach((opt, k) => {
						opt.correct = k === j;
					});
				}
			});

			exerciseListEl.addEventListener("click", (e) => {
				const removeBtn = e.target.closest("[data-remove-exercise]");
				if (!removeBtn) return;
				const i = parseInt(removeBtn.dataset.removeExercise, 10);
				if (lesson.exercises.length <= 1) {
					saveErrorEl.textContent = "В уроці має лишитись хоча б одна вправа.";
					return;
				}
				lesson.exercises.splice(i, 1);
				renderExercises();
			});

			addExerciseBtn.addEventListener("click", () => {
				lesson.exercises.push(LessonsStore.createEmptyExercise());
				renderExercises();
				exerciseListEl.lastElementChild.scrollIntoView({ behavior: "smooth", block: "center" });
			});

			function validate() {
				if (!lessonTitleEl.value.trim()) {
					return "Введи назву уроку.";
				}
				for (let i = 0; i < lesson.exercises.length; i++) {
					const ex = lesson.exercises[i];
					if (!ex.question.trim()) {
						return `Вправа ${i + 1}: заповни питання.`;
					}
					if (ex.options.some((o) => !o.value.trim())) {
						return `Вправа ${i + 1}: заповни всі 3 варіанти відповіді.`;
					}
					if (!ex.options.some((o) => o.correct)) {
						return `Вправа ${i + 1}: познач, який варіант правильний.`;
					}
				}
				return null;
			}

			saveBtn.addEventListener("click", (e) => {
				e.preventDefault();
				lesson.title = lessonTitleEl.value.trim();
				const error = validate();
				if (error) {
					saveErrorEl.textContent = error;
					return;
				}
				saveErrorEl.textContent = "";
				LessonsStore.upsert(lesson);
				location.href = "index.html";
			});

			renderExercises();
		</script>
	</body>
</html>
